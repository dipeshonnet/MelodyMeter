name: Deploy MelodyMeter to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: https://melody.everydayai.work
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types and run unit and API tests
        run: |
          pnpm check
          pnpm test

      - name: Build public pages
        run: node scripts/run.mjs astro build

      - name: Deploy to the existing production project
        env:
          CLOUDFLARE_ACCOUNT_ID: 68f7d76f0db9c20630b0b4b97505f5d0
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository Actions secret with Account / Cloudflare Pages / Edit permission, then rerun this workflow."
            exit 1
          fi
          node scripts/run.mjs wrangler pages deploy dist --project-name melodymeter --branch main --commit-hash "$GITHUB_SHA"

      - name: Verify the live build and API
        run: node scripts/verify-deployment.mjs
